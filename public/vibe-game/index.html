  <style>
    :root{--bg:#050807;--panel:#09100f;--line:#213431;--cyan:#00d8e8;--mint:#72d6a5;--text:#edf6f5;--dim:#7f918e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(rgba(0,216,232,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,216,232,.035) 1px,transparent 1px),#050807;background-size:40px 40px}button,a{font:inherit}.app{width:min(1440px,calc(100% - 40px));min-height:100vh;margin:auto;padding:24px 0 48px}.topbar{height:54px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:#07100f;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.brand{display:flex;align-items:center;gap:12px}.brand i{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}.topbar span:last-child{color:var(--dim)}.shell{margin-top:16px;min-height:calc(100vh - 118px);border:1px solid var(--line);background:rgba(3,7,7,.92);box-shadow:0 28px 80px #0008}.cover{position:relative;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(420px,.92fr);overflow:hidden}.cover-copy{padding:clamp(48px,8vw,120px);display:flex;flex-direction:column;justify-content:center}.kicker,.eyebrow{color:var(--cyan);font:650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}.cover h1{margin:30px 0 26px;font-size:clamp(4.3rem,8vw,9.6rem);font-weight:800;line-height:.86;letter-spacing:-.09em}.cover h1 em{display:block;color:transparent;-webkit-text-stroke:1px #72817f;font-style:normal}.cover p{max-width:540px;margin:0;color:var(--dim);font-size:16px;line-height:1.8}.start{width:max-content;margin-top:46px;padding:17px 22px;border:1px solid var(--cyan);background:var(--cyan);color:#001010;cursor:pointer;font:800 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;transition:.2s}.start:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(0,216,232,.2)}.start span{margin-left:34px}.terminal{margin:44px;align-self:stretch;border:1px solid #2a403d;background:#060b0a;display:grid;grid-template-rows:48px 1fr}.terminal-bar{padding:0 16px;display:grid;grid-template-columns:70px 1fr auto;align-items:center;border-bottom:1px solid var(--line);color:#60716f;font:500 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:#263634}.dots i:first-child{background:var(--cyan)}.terminal-bar em{color:var(--mint);font-style:normal}.terminal-body{padding:32px;display:flex;flex-direction:column;justify-content:center;font:500 13px/1.95 ui-monospace,SFMono-Regular,Menlo,monospace;color:#a9b9b7}.terminal-body span{color:#39514e;display:inline-block;width:34px}.terminal-body b{color:var(--cyan);font-weight:500}.terminal-body i{color:var(--cyan);font-style:normal;animation:blink 1s steps(1) infinite}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:auto;padding-top:38px}.stats div{padding:16px 12px;border:1px solid #1d2c2a;color:#6f817e;font:500 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.stats strong{display:block;margin-bottom:5px;color:#dbe7e5;font-size:17px}.quiz{display:grid;grid-template-columns:210px 1fr}.side{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column}.side .back{border:0;background:transparent;color:#8fa09f;text-align:left;cursor:pointer;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.side .back:hover{color:var(--text)}.step-list{margin-top:68px;display:grid;gap:13px;color:#3e504d;font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.step-list span.active{color:var(--cyan)}.side small{margin-top:auto;color:#4f625f;font:500 9px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.quiz-main{padding:clamp(34px,6vw,84px);display:flex;flex-direction:column}.progress{display:flex;align-items:center;gap:16px;color:var(--dim);font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.progress div{flex:1;height:1px;background:#20312f}.progress i{display:block;height:1px;background:var(--cyan);box-shadow:0 0 9px var(--cyan);transition:.25s}.question{max-width:900px;margin:70px 0 45px;font-size:clamp(2.4rem,5vw,5.7rem);line-height:1.02;letter-spacing:-.06em}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{min-height:100px;padding:20px;display:grid;grid-template-columns:32px 1fr auto;gap:15px;align-items:center;border:1px solid #263936;background:#07100f;color:#a8b8b6;text-align:left;cursor:pointer;transition:.2s}.choice:hover{border-color:#58716d;transform:translateY(-2px)}.choice.active{border-color:var(--cyan);background:#082022;color:var(--text);box-shadow:inset 3px 0 var(--cyan)}.choice b{display:grid;width:30px;height:30px;place-items:center;border:1px solid currentColor;border-radius:50%;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace}.choice i{color:var(--cyan);font-style:normal}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:34px}.previous{border:0;background:transparent;color:#657774;cursor:pointer}.previous:disabled{opacity:.2}.next{padding:15px 20px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);cursor:pointer;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em}.next:disabled{opacity:.25;cursor:not-allowed}.result{padding:clamp(38px,7vw,100px);display:grid;grid-template-columns:minmax(0,.8fr) minmax(420px,1.2fr);gap:8vw;align-items:center}.result-code{padding:28px;border:1px solid var(--line);background:#060b0a;font:500 12px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;color:#78908c}.result-code span{color:#354d49;display:inline-block;width:30px}.result-code b{color:var(--cyan);font-weight:500}.result-copy h1{margin:24px 0 14px;font-size:clamp(4.5rem,9vw,9rem);line-height:.85;letter-spacing:-.09em}.result-copy h2{margin:0;color:var(--mint);font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}.result-copy p{max-width:620px;margin:36px 0 0;color:#91a19f;line-height:1.85}.result-copy p b{display:block;margin-top:18px;color:#dce7e5}.again{margin-top:38px}.hidden{display:none!important}@keyframes blink{50%{opacity:0}}@media(max-width:900px){.app{width:calc(100% - 20px)}.cover{grid-template-columns:1fr}.cover-copy{padding:48px 28px}.terminal{margin:0 24px 24px;min-height:390px}.quiz{grid-template-columns:1fr}.side{padding:18px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center}.step-list,.side small{display:none}.quiz-main{padding:36px 22px}.question{margin:50px 0 32px}.options{grid-template-columns:1fr}.result{grid-template-columns:1fr;padding:48px 24px}.result-code{order:2}}
  </style>
  <style>
    .app{position:relative}.project-back{position:absolute;z-index:10;left:0;top:24px;display:flex;align-items:center;gap:10px;color:#8fa09f;text-decoration:none;font:650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.13em}.project-back span{display:grid;place-items:center;width:38px;height:38px;border:1px solid #29403d;border-radius:50%;background:#07100f;color:#eafafa;font-size:16px;transition:.2s}.project-back:hover{color:#eafafa}.project-back:hover span{border-color:var(--cyan);background:var(--cyan);color:#001010}.topbar{border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 4px 0 160px}.topbar>span:last-child{display:none}.cover{display:block}.cover-copy{min-height:calc(100vh - 150px);padding:clamp(44px,8vw,120px);align-items:flex-start}.cover h1{max-width:1150px;margin:34px 0 36px;font-size:clamp(4.7rem,9.2vw,10.5rem);line-height:.94;letter-spacing:-.075em}.cover h1 em{display:block;margin-top:.08em;color:var(--cyan);-webkit-text-stroke:0}.cover p{max-width:650px;font-size:17px}.cover .start{min-width:340px;margin-top:58px;padding:10px 10px 10px 30px;display:flex;align-items:center;justify-content:space-between;border-radius:999px;font-size:14px;text-align:left}.cover .start span{width:48px;height:48px;margin:0;display:grid;place-items:center;border-radius:50%;background:#001010;color:var(--cyan);font-size:22px}.terminal{display:none!important}@media(max-width:700px){.project-back small{display:none}.topbar{padding-left:58px}.cover-copy{min-height:calc(100svh - 100px);padding:52px 20px}.cover h1{font-size:clamp(4rem,18vw,6.6rem);line-height:.98}.cover .start{width:100%;min-width:0}}

<body><main class="app"><a class="project-back" href="../#projects-vibecoding" aria-label="返回 Vibe Coding 项目列表"><span aria-hidden="true">←</span><small>ALL PROJECTS</small></a><header class="topbar"><div class="brand"><i></i><b>本体观察处 / IDENTITY LAB</b></div><span>SESSION STATUS · ONLINE</span></header><section id="view" class="shell"></section></main>
<script>
const questions=[
['凌晨三点，冰箱灯突然给你发来好友申请。验证消息是？',[["我见过你所有的夜宵。",0],["别怕，我只是有点冷。",2],["速来，鸡蛋正在开会。",4],["通过，但设置为仅聊天。",5]]],
['公司打印机吐出一张纸：今天它才是你的领导。你会？',[["请它先同步本季度 OKR。",1],["给它加纸，领导不能饿着。",2],["把辞职信塞回去让它审批。",4],["假装卡纸，双方冷静一下。",5]]],
['你在路边捡到一段没人要的星期二。怎么处理？',[["塞进周末，做成三天小长假。",3],["挂闲鱼：九成新，轻微班味。",1],["给它浇水，看能不能长成星期五。",4],["放回原处，我和星期二不熟。",5]]],
['导航突然说：“前方直行，去成为你自己。”你会？',[["要求它提供三条备选人生路线。",3],["问预计到达时间和是否堵车。",0],["立刻掉头，我还没准备好。",5],["打开车窗大喊：重新规划！",4]]],
['你的影子宣布单飞，还带走了你一半的班味。你会？',[["祝它出道成功，记得分我版权费。",1],["追问剩下一半能不能也带走。",5],["给它做视觉包装和出道海报。",4],["先建群，约定每周同步进度。",3]]],
['外星人误把你当作地球客服，投诉月亮太亮。你回复？',[["已为您提交“月亮降亮度”工单。",1],["建议闭上一只眼，立省 50%。",4],["非常理解，夜晚也需要被倾听。",2],["转接太阳部门，请稍候。",0]]],
['电梯里的“关门”按钮开始收取情绪手续费。你会？',[["等它自然关，省下一份情绪。",5],["刷十次，办一张包月卡。",1],["和门商量：今天大家都不容易。",2],["走楼梯，并向电梯发送分手短信。",4]]],
['你的待办清单长出腿，拖着行李准备离家出走。你会？',[["帮它叫车，地址填明天。",5],["谈判：完成两项就准你走。",3],["把最难的一项藏起来，假装没看见。",0],["给它办欢送会，顺便宣布今天放假。",4]]],
['一盆会议室绿植知道公司全部秘密，但只肯说一句。你问？',[["谁每天偷调空调？",0],["我什么时候可以合法下班？",5],["这家公司真正的老板是不是你？",4],["你需要换盆，还是需要换工作？",2]]],
['世界末日只剩十分钟，你的手机还剩 1% 电。最后做什么？',[["打开省电模式，末日也要有规划。",3],["给共享充电宝写一封道歉信。",1],["拍一张糊掉的月亮发朋友圈。",4],["关机。剩下十分钟归我自己。",5]]]
];
const types=[
['半夜三点自动续杯的冰箱灯','MIDNIGHT FRIDGE LIGHT','你表面安静，实际上记住了所有细节。别人以为你只负责照明，你却见证过凌晨的蛋糕、冷饭和人类突然产生的宏大决心。','今晚开冰箱前，先和里面的自己打个招呼。'],
['会记仇的共享充电宝','GRUDGE-KEEPING POWER BANK','你很有用，也很有原则。谁借了你的能量不归还，你不会当场翻脸，但会在对方最需要 1% 电量时显示“设备故障”。','善良可以续航，但记得按时归还。'],
['刚拿到心理咨询证的塑料袋','EMOTIONAL STORAGE BAG','你总能接住别人的破事、剩饭和突然崩溃。虽然证是昨晚打印的，但你提供的情绪收纳空间意外地靠谱。','今天少装一点，袋子也有承重上限。'],
['失眠的导航语音','INSOMNIAC NAVIGATION VOICE','你擅长为所有人重新规划路线，却经常忘记自己要去哪。深夜没人开车时，你会独自练习：“前方掉头，回到快乐。”','走错路不算失败，只是系统正在重新规划。'],
['野生会议室绿植','FERAL MEETING-ROOM PLANT','你看起来在发呆，其实掌握了整个办公室最完整的情报。你靠喝隔夜水活着，并用长新叶的方式表达对荒唐世界的轻微嘲讽。','少开一个会，多晒十分钟太阳。'],
['正在休年假的小区门禁','GATE ON ANNUAL LEAVE','你不是冷漠，只是暂时不想识别任何人。外界不断刷卡、拍打、呼叫物业，而你决定保持红灯，享受一次制度允许之外的休息。','今天可以拒绝一次没有预约的情绪来访。']
];
let step=0,answers=Array(questions.length).fill(null);const view=document.querySelector('#view');
function cover(){view.className='shell cover';view.innerHTML=`<div class="cover-copy"><span class="kicker">IDENTITY TEST / 10 QUESTIONS</span><h1>你的真实形态<em>是什么？</em></h1><p>别想太久，凭第一反应选。最后看看你到底是什么奇怪东西。</p><button class="start" id="start">START TEST <span>→</span></button></div>`;document.querySelector('#start').onclick=quiz}
function quiz(){view.className='shell quiz';let q=questions[step],picked=answers[step];view.innerHTML=`<aside class="side"><button class="back" id="home">← EXIT TEST</button><div class="step-list">${questions.map((_,i)=>`<span class="${i===step?'active':''}">${String(i+1).padStart(2,'0')} / QUESTION</span>`).join('')}</div><small>IDENTITY LAB<br>LOCAL SESSION<br>NO DATA SAVED</small></aside><section class="quiz-main"><div class="progress"><span>${String(step+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}</span><div><i style="width:${(step+1)/questions.length*100}%"></i></div><span>OBSERVING</span></div><span class="eyebrow" style="margin-top:56px">QUICK RESPONSE REQUIRED</span><h1 class="question">${q[0]}</h1><div class="options">${q[1].map((x,i)=>`<button class="choice ${picked===i?'active':''}" data-i="${i}"><b>${'ABCD'[i]}</b><span>${x[0]}</span><i>${picked===i?'●':''}</i></button>`).join('')}</div><div class="actions"><button class="previous" id="prev" ${step===0?'disabled':''}>← PREVIOUS</button><button class="next" id="next" ${picked===null?'disabled':''}>${step===questions.length-1?'GENERATE RESULT':'NEXT QUESTION →'}</button></div></section>`;document.querySelector('#home').onclick=cover;document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{answers[step]=+el.dataset.i;quiz()});document.querySelector('#prev').onclick=()=>{if(step){step--;quiz()}};document.querySelector('#next').onclick=()=>{if(answers[step]===null)return;if(step===questions.length-1)result();else{step++;quiz()}}}
function result(){let score=Array(types.length).fill(0);answers.forEach((choice,i)=>score[questions[i][1][choice][1]]++);let win=score.indexOf(Math.max(...score)),d=types[win];view.className='shell result';view.innerHTML=`<div class="result-code"><div><span>01</span>analysis.complete = <b>true</b>;</div><div><span>02</span>dominant_pattern = "${d[1]}";</div><div><span>03</span>absurdity_level = ${Math.round(78+Math.max(...score)*3)}%;</div><div><span>04</span>render(identity);<b>▌</b></div></div><div class="result-copy"><span class="eyebrow">IDENTITY REPORT / GENERATED</span><h1>${d[0]}</h1><h2>${d[1]}</h2><p>${d[2]}<b>TODAY'S NOTE · ${d[3]}</b></p><button class="start again" id="again">RUN AGAIN <span>↻</span></button></div>`;document.querySelector('#again').onclick=()=>{step=0;answers.fill(null);cover()}}
cover();
</script><script>
(()=>{const videos=document.querySelectorAll('video[data-src]');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const io=new IntersectionObserver(entries=>entries.forEach(({target:v,isIntersecting})=>{if(isIntersecting){if(v.dataset.src){v.src=v.dataset.src;delete v.dataset.src;v.load();}if(v.autoplay&&!reduced)v.play().catch(()=>{v.controls=true;});}else v.pause();}),{rootMargin:'120px 0px',threshold:0.01});videos.forEach(v=>{v.playsInline=true;v.addEventListener('error',()=>{v.controls=true;});if(reduced)v.controls=true;io.observe(v);});})();
</script>
</body></html>

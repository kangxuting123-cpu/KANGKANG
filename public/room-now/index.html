<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room Now — Feishu Office Plugin</title><link rel="stylesheet" href="./style.css"></head>
<body><header class="bar"><a href="../#projects-vibecoding">← 返回项目</a><b>ROOM NOW / LIVE DEMO</b><span>● 实时更新</span></header>
<main><section class="intro"><p>FEISHU OFFICE PLUGIN</p><h1>现在，哪间<br>会议室是空的？</h1><span>选人数、选时长，直接在办公室地图上找到最近的空闲会议室。</span></section>
<section class="app" data-room-app>
<header class="app-top"><strong>Room Now</strong><span>字节跳动 · 方恒时尚中心</span><i>14:32 实时状态</i></header>
<div class="filters"><div><small>参会人数</small><span><button type="button" data-people="2">2 人</button><button class="active" type="button" data-people="4">4 人</button><button type="button" data-people="8">8 人</button></span></div><div><small>使用时长</small><span><button type="button" data-time="30">30 分钟</button><button class="active" type="button" data-time="60">1 小时</button><button type="button" data-time="120">2 小时</button></span></div><div><small>楼层</small><select data-floor><option value="8">8F</option><option value="9">9F</option><option value="10">10F</option></select></div></div>
<div class="workspace"><section class="map"><div class="map-title"><span>8F · 西区</span><small><i></i>空闲 <i></i>使用中</small></div><div class="floor"><div class="hall">电梯厅</div><button class="room free active" style="--x:7%;--y:8%;--w:30%;--h:31%" data-room="春分" data-size="4"><strong>春分</strong><span>4 人 · 空闲至 16:00</span></button><button class="room busy" style="--x:41%;--y:8%;--w:25%;--h:31%" disabled><strong>谷雨</strong><span>6 人 · 使用中</span></button><button class="room free" style="--x:70%;--y:8%;--w:23%;--h:31%" data-room="白露" data-size="4"><strong>白露</strong><span>4 人 · 空闲至 15:30</span></button><button class="room busy" style="--x:7%;--y:60%;--w:26%;--h:30%" disabled><strong>霜降</strong><span>8 人 · 使用中</span></button><button class="room free" style="--x:37%;--y:60%;--w:35%;--h:30%" data-room="小满" data-size="8"><strong>小满</strong><span>8 人 · 空闲至 17:00</span></button><div class="facility" style="--x:76%;--y:60%">茶水间</div><div class="you">你在这里</div></div></section>
<aside class="detail"><div class="room-photo"><span>8F · 步行 1 分钟</span><strong data-name>春分</strong></div><div class="info"><p><span>容纳人数</span><b data-capacity>4 人</b></p><p><span>可用时间</span><b data-slot>14:35—15:35</b></p><p><span>设备</span><b>电视 · 白板 · 视频会议</b></p></div><label>会议名称<input data-title value="临时讨论"></label><button class="book" type="button" data-book>立即预订</button><small data-hint>将同步到你的飞书日历</small></aside></div>
<div class="toast" data-toast>预订成功</div></section></main><script src="./script.js"></script></body></html>
